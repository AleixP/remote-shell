name: Fuzz

# Runs the Go fuzz tests for a while each week. They throw random and
# malformed input at everything the agent parses or authenticates. A failing
# input is saved as a file and uploaded, so it can be replayed.
on:
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per fuzz target (for example 60s or 5m)
        default: 60s
  schedule:
    - cron: "43 3 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Fuzz
        run: make fuzz FUZZTIME=${{ inputs.fuzztime || '60s' }}
      - name: Keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failing-fuzz-inputs
          path: agent/internal/**/testdata/fuzz/
          if-no-files-found: ignore
